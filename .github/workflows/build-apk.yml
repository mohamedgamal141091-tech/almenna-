name: بناء تطبيق الأندرويد

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تثبيت المكتبات
        run: npm install

      - name: رقم الإصدار
        run: echo "{\"build\": ${{ github.run_number }}, \"version\": \"2.2.${{ github.run_number }}\"}" > www/build.json

      - name: إنشاء مشروع الأندرويد
        run: |
          npx cap add android
          npx cap sync android

      - name: الأيقونة والإصدار والأذونات
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp www/icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.2.${{ github.run_number }}\"/" android/app/build.gradle
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />#' android/app/src/main/AndroidManifest.xml
          grep -n "version" android/app/build.gradle | head -5

      - name: مفتاح توقيع ثابت حتى يُثبَّت كل إصدار فوق السابق
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: بناء ملف APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../almenna.apk

      - name: حفظ الملف
        uses: actions/upload-artifact@v4
        with:
          name: almenna-apk
          path: almenna.apk

      - name: نشر إصدار جديد
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: المنة — الإصدار 2.2.${{ github.run_number }}
          body: |
            ملف التثبيت almenna.apk — يُنزَّل على الهاتف ويُفتح لتثبيته.
            تطبيق واحد يجمع برنامج الويندوز 2.1.0 كاملًا مع بياناته، وميزات نسخة الأندرويد السابقة، ومئة ميزة جديدة تعمل مع TalkBack.
          files: almenna.apk
          make_latest: true
