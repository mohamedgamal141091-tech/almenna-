name: بناء تطبيق الأندرويد

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تثبيت المكتبات
        run: npm install

      - name: إنشاء مشروع الأندرويد
        run: |
          npx cap add android
          npx cap sync android

      - name: بناء ملف APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../almenna.apk

      - name: حفظ الملف
        uses: actions/upload-artifact@v4
        with:
          name: almenna-apk
          path: almenna.apk

      - name: نشر إصدار جديد
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: المنة — الإصدار 1.0.${{ github.run_number }}
          body: ملف التثبيت almenna.apk — يُنزَّل على الهاتف ويُفتح لتثبيته.
          files: almenna.apk
